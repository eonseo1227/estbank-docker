services:
  intra-db:
    image: mariadb:10.11
    container_name: intra-db
    env_file: .env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    restart: unless-stopped

  dmz-web1:
    build: ./docker/web
    container_name: dmz-web1
    volumes:
      - ./web:/var/www/html:z
      - uploads:/var/www/html/uploads
      - sessions:/var/lib/php/sessions
    depends_on:
      - intra-db
    restart: unless-stopped

  dmz-web2:
    build: ./docker/web
    container_name: dmz-web2
    volumes:
      - ./web:/var/www/html:z
      - uploads:/var/www/html/uploads
      - sessions:/var/lib/php/sessions
    depends_on:
      - intra-db
    restart: unless-stopped

  dmz-lb:
    image: nginx:stable
    container_name: dmz-lb
    ports:
      - "8080:80"
    volumes:
      - ./docker/lb/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - dmz-web1
      - dmz-web2
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  sessions:
