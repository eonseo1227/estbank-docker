services:
  fw:
    build: ./docker/fw
    container_name: fw
    command: ["sh", "-c", "sh /start.sh"]
    volumes:
      - ./docker/fw/rules.sh:/rules.sh:ro,z
      - ./docker/fw/start.sh:/start.sh:ro,z
      - ./docker/fw/suricata.rules:/suricata.rules:ro,z
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      outside:
        ipv4_address: 192.168.156.254
      dmz:
        ipv4_address: 192.168.155.254
      intra:
        ipv4_address: 192.168.153.254
    restart: unless-stopped

  kali:
    build: ./docker/kali
    container_name: kali
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    networks:
      outside:
        ipv4_address: 192.168.156.123
    restart: unless-stopped

  intra-db:
    image: mariadb:10.11
    container_name: intra-db
    env_file: .env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    networks:
      intra:
        ipv4_address: 192.168.153.103
    restart: unless-stopped

  intra-web:
    build: ./docker/web
    container_name: intra-web
    ports:
      - "8081:80"
    volumes:
      - ./admin:/var/www/html:z
      - uploads:/var/www/html/uploads
    networks:
      intra:
        ipv4_address: 192.168.153.110
    depends_on:
      - intra-db
    restart: unless-stopped

  dmz-web1:
    build: ./docker/web
    container_name: dmz-web1
    volumes:
      - ./web:/var/www/html:z
      - uploads:/var/www/html/uploads
      - sessions:/var/lib/php/sessions
    networks:
      dmz:
        ipv4_address: 192.168.155.200
    restart: unless-stopped

  dmz-web2:
    build: ./docker/web
    container_name: dmz-web2
    volumes:
      - ./web:/var/www/html:z
      - uploads:/var/www/html/uploads
      - sessions:/var/lib/php/sessions
    networks:
      dmz:
        ipv4_address: 192.168.155.201
    restart: unless-stopped

  dmz-lb:
    image: nginx:stable
    container_name: dmz-lb
    ports:
      - "8080:80"
    volumes:
      - ./docker/lb/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    networks:
      dmz:
        ipv4_address: 192.168.155.10
    depends_on:
      - dmz-web1
      - dmz-web2
    restart: unless-stopped

networks:
  outside:
    ipam:
      config:
        - subnet: 192.168.156.0/24
  dmz:
    ipam:
      config:
        - subnet: 192.168.155.0/24
  intra:
    ipam:
      config:
        - subnet: 192.168.153.0/24

volumes:
  db-data:
  uploads:
  sessions:
