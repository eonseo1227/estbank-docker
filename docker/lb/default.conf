upstream estbank {
    server dmz-web1:80;
    server dmz-web2:80;
}

server {
    listen 80;

    location / {
        proxy_pass http://estbank;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream $upstream_addr;
    }
}
